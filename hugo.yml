baseURL: "https://gh.heruos.top/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "Bookstack"
theme: ["bookstack"]

contentDir: "content"
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true
mainSections: ["docs"]

module:
  hugoVersion:
    extended: true
    min: "0.140.0"
  imports:
    - path: "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"

markup:
  defaultMarkdownHandler: "goldmark"
  tableOfContents:
    startLevel: 1
    endLevel: 3
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

outputs:
  home: ["HTML"]
  page: ["HTML"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

params:
  description: "Bookstack 多文档技术手册"
  author: "Rainux He"

  google_fonts:
    - ["IBM Plex Sans", "400,500,600,700"]
    - ["IBM Plex Mono", "400,600"]
  sans_serif_font: "IBM Plex Sans"
  secondary_font: "IBM Plex Sans"
  mono_font: "IBM Plex Mono"

  footer:
    copyright: "© :YEAR: Bookstack"

  social:
    github: "rainuxhe"

  docs:
    title: "Bookstack"
    pathName: "docs"
    darkMode: true
    prism: true
    prismTheme: "lotusdocs"
    repoURL: "https://github.com/rainuxhe/rainuxhe.github.io"
    repoBranch: "main"
    editPage: true
    lastMod: true
    lastModRelative: true
    useLastmodTime: false
    sidebarIcons: false
    breadcrumbs: true
    backToTop: true
    toc: true
    tocMobile: true
    scrollSpy: true
    descriptions: true
    titleIcon: true
    navDesc: true
    navDescTrunc: 48
    listDescTrunc: 140
    intLinkTooltip: true
    extLinkNewTab: true

  documents:
    - id: "fastapi"
      title: "FastAPI"
      path: "/docs/fastapi/"
      description: "异步 Python API 框架的请求处理、依赖注入与数据访问笔记。"
      icon: "bolt"
      weight: 10
    - id: "postgresql"
      title: "PostgreSQL"
      path: "/docs/postgresql/"
      description: "PostgreSQL 日常操作、事务、索引与运维实践。"
      icon: "database"
      weight: 20
    - id: "markdown-test"
      title: "Markdown 测试"
      path: "/docs/markdown-test/"
      description: "用于检查多级目录、Markdown 语法和内容样式的测试文档。"
      icon: "science"
      weight: 30

  flexsearch:
    enabled: true
    searchSectionsIndex: ["docs"]
    tokenize: "full"
    minQueryChar: 1
    maxResult: 8

menu:
  primary:
    - name: "文档"
      url: "/docs/"
      identifier: "docs"
      weight: 10
