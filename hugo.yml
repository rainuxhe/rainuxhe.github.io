baseURL: "https://gh.heruos.top/"
locale: "zh-CN"
defaultContentLanguage: "zh"
title: "Bookstack"
theme: ["bookstack"]

contentDir: "content"
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: false
mainSections: ["docs"]

module:
  hugoVersion:
    extended: true
    min: "0.169.0"
  imports:
    - path: "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"

markup:
  defaultMarkdownHandler: "goldmark"
  tableOfContents:
    startLevel: 1
    endLevel: 3
  highlight:
    noClasses: true
    lineNos: false
    # lineNumbersInTable: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

outputs:
  home: ["HTML", "JSON"]
  page: ["HTML"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

params:
  description: "Bookstack 多文档技术手册"
  author: "Rainux He"

  google_fonts:
    - ["IBM Plex Sans", "400,500,600,700"]
    - ["IBM Plex Mono", "400,600"]
  sans_serif_font: "IBM Plex Sans"
  secondary_font: "IBM Plex Sans"
  mono_font: "IBM Plex Mono"

  footer:
    copyright: "© :YEAR: Bookstack"

  social:
    github: "rainuxhe"

  docs:
    title: "Bookstack"
    pathName: "docs"
    darkMode: true
    repoURL: "https://github.com/rainuxhe/rainuxhe.github.io"
    repoBranch: "main"
    editPage: true
    lastMod: true
    lastModRelative: true
    breadcrumbs: true
    backToTop: true
    toc: true
    tocMobile: true
    scrollSpy: true
    descriptions: true
    titleIcon: true
    navDesc: true
    navDescTrunc: 48
    listDescTrunc: 140
    intLinkTooltip: true
    extLinkNewTab: true

  documents:
    # - id: "fastapi"
    #   title: "FastAPI"
    #   path: "/docs/fastapi/"
    #   description: "异步 Python API 框架的请求处理、依赖注入与数据访问笔记。"
    #   icon: "bolt"
    #   weight: 10
    # - id: "postgresql"
    #   title: "PostgreSQL"
    #   path: "/docs/postgresql/"
    #   description: "PostgreSQL 日常操作、事务、索引与运维实践。"
    #   icon: "database"
    #   weight: 20
    - id: "bookstack"
      title: "BookStack"
      path: "/docs/bookstack/"
      description: "BookStack 的安装、配置、Markdown 语法和扩展功能说明。"
      icon: "menu_book"
      weight: 30
    - id: "a2a"
      title: "A2A 协议"
      path: "/docs/a2a/"
      description: "A2A 协议模型、任务生命周期，以及 Python 服务端和客户端实践。"
      icon: "hub"
      weight: 40

  flexsearch:
    enabled: true
    searchSectionsIndex: ["docs"]
    tokenize: "full"
    minQueryChar: 1
    maxResult: 8

menu:
  primary:
    - name: "文档"
      url: "/docs/"
      identifier: "docs"
      weight: 10
    - name: "关于"
      url: "/posts/about/"
      identifier: "about"
      weight: 20
