<script type="module">
window.addEventListener("load", function () {
    const suggestions = document.getElementById("suggestions");
    const search = document.getElementById("flexsearch");
    const flexsearchContainer = document.getElementById("FlexSearchCollapse");
    const hideFlexsearchBtn = document.getElementById("hideFlexsearch");
    const maxResult = {{ .Site.Params.flexsearch.maxResult | default 5 }};
    const minlength = {{ .Site.Params.flexsearch.minQueryChar | default 0 }};
    let searchIndexPromise;
    let searchSequence = 0;

    if (!suggestions || !search || !flexsearchContainer || !hideFlexsearchBtn) {
        return;
    }

    const flexsearchContainerCollapse = new Collapse(flexsearchContainer, { toggle: false });

    function getSearchIndex() {
        if (!searchIndexPromise) {
            searchIndexPromise = fetch({{ "index.json" | relURL | jsonify | safeJS }})
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Unable to load search index");
                    }
                    return response.json();
                })
                .then(function (documents) {
                    const searchIndex = new FlexSearch.Document({
                        tokenize: {{ .Site.Params.flexsearch.tokenize | default "forward" | jsonify | safeJS }},
                        minlength: minlength,
                        cache: {{ .Site.Params.flexsearch.cache | default 100 }},
                        optimize: {{ .Site.Params.flexsearch.optimize | default true }},
                        document: {
                            id: "id",
                            store: ["href", "title", "description", "doc", "docId"],
                            index: ["title", "description", "content"]
                        }
                    });

                    documents.forEach(function (document, documentIndex) {
                        searchIndex.add(Object.assign({ id: documentIndex }, document));
                    });

                    return searchIndex;
                });
        }

        return searchIndexPromise;
    }

    function inputFocus(event) {
        if (event.ctrlKey && event.key === "/") {
            event.preventDefault();
            flexsearchContainerCollapse.toggle();
        }
        if (event.key === "Escape") {
            search.blur();
            suggestions.classList.add("d-none");
            flexsearchContainerCollapse.hide();
        }
    }

    document.addEventListener("keydown", inputFocus);
    flexsearchContainer.addEventListener("shown.bs.collapse", function () {
        search.focus();
    });
    document.addEventListener("click", function (event) {
        if (!flexsearchContainer.contains(event.target) && !document.getElementById("top-header").contains(event.target)) {
            flexsearchContainerCollapse.hide();
        }
        if (!suggestions.contains(event.target)) {
            suggestions.classList.add("d-none");
        }
    });
    hideFlexsearchBtn.addEventListener("click", function () {
        flexsearchContainerCollapse.hide();
    });

    document.addEventListener("keydown", function (event) {
        if (suggestions.classList.contains("d-none")) return;

        const focusableSuggestions = Array.from(suggestions.querySelectorAll("a"));
        if (!focusableSuggestions.length) return;

        const index = focusableSuggestions.indexOf(document.activeElement);
        if (event.key === "ArrowUp") {
            event.preventDefault();
            focusableSuggestions[Math.max(index - 1, 0)].focus();
        }
        if (event.key === "ArrowDown") {
            event.preventDefault();
            focusableSuggestions[Math.min(index + 1, focusableSuggestions.length - 1)].focus();
        }
    });

    async function showResults() {
        const sequence = ++searchSequence;
        const searchQuery = search.value.trim();
        suggestions.replaceChildren();

        if (!searchQuery) {
            suggestions.classList.add("d-none");
            return;
        }

        suggestions.classList.remove("d-none");

        if (searchQuery.length < minlength) {
            const minCharMessage = document.createElement("div");
            minCharMessage.textContent = `请至少输入 ${minlength} 个字符`;
            minCharMessage.classList.add("suggestion__no-results");
            suggestions.appendChild(minCharMessage);
            return;
        }

        let index;
        try {
            index = await getSearchIndex();
        } catch (error) {
            if (sequence !== searchSequence) return;
            const errorMessage = document.createElement("div");
            errorMessage.textContent = "搜索索引加载失败，请刷新页面重试。";
            errorMessage.classList.add("suggestion__no-results");
            suggestions.appendChild(errorMessage);
            return;
        }

        if (sequence !== searchSequence) return;

        const results = index.search(searchQuery, { limit: maxResult, enrich: true });
        const flatResults = new Map();

        for (const result of results.flatMap(function (item) { return item.result; })) {
            if (!flatResults.has(result.doc.href)) {
                flatResults.set(result.doc.href, result.doc);
            }
        }

        if (flatResults.size === 0) {
            const noResultsMessage = document.createElement("div");
            noResultsMessage.textContent = `没有找到 "${searchQuery}"`;
            noResultsMessage.classList.add("suggestion__no-results");
            suggestions.appendChild(noResultsMessage);
            return;
        }

        for (const [href, resultDoc] of flatResults) {
            const entry = document.createElement("div");
            const link = document.createElement("a");
            const badge = document.createElement("span");
            const title = document.createElement("span");
            const description = document.createElement("span");

            link.href = href;
            badge.textContent = resultDoc.doc;
            badge.classList.add("suggestion__doc");
            title.textContent = resultDoc.title;
            title.classList.add("suggestion__title");
            description.textContent = resultDoc.description;
            description.classList.add("suggestion__description");

            link.append(badge, title, description);
            entry.appendChild(link);
            suggestions.appendChild(entry);

            if (suggestions.childElementCount === maxResult) break;
        }
    }

    search.addEventListener("input", showResults);
});
</script>
