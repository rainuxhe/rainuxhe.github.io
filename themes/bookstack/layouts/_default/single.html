{{ define "main" }}
    <section class="bookstack-catalog section">
        <div class="container">
            <article class="bookstack-page">
                <header class="bookstack-catalog-heading">
                    <span class="bookstack-eyebrow">Page</span>
                    <h1>{{ .Title }}</h1>
                    {{ with .Description }}
                        <p class="bookstack-catalog-intro">{{ . }}</p>
                    {{ end }}
                </header>
                <div class="docs-content main-content">
                    {{ .Content }}
                </div>
            </article>
        </div>
    </section>
{{ end }}
