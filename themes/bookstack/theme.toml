# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Bookstack"
license = "MIT"
licenselink = "https://github.com/rainuxhe/rainuxhe.github.io/blob/main/themes/bookstack/LICENSE"
description = "A LotusDocs-derived Hugo theme with first-class multi-document support"
homepage = "https://gh.heruos.top/"
demosite = "https://gh.heruos.top/"
tags = ["documentation", "multi-document", "hugo", "bootstrap", "search", "dark mode"]
features = ["multi-document navigation", "document-scoped sidebars", "global search", "responsive design", "dark mode"]
min_version = "0.140.0"

[author]
  name = "Rainux He"
  homepage = "https://gh.heruos.top/"
